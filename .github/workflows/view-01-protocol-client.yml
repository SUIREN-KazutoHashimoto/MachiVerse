name: VIEW-01 Protocol Client

on:
  pull_request:
    branches: [view]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/MachiVerse.GeneralView/MachiVerse.GeneralView.csproj
      - name: Build
        run: dotnet build src/MachiVerse.GeneralView/MachiVerse.GeneralView.csproj --configuration Release --no-restore
