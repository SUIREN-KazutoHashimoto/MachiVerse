name: GW-01 Protocol Config

on:
  pull_request:
    branches: [gateway]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/MachiVerse.Gateway/MachiVerse.Gateway.csproj
      - name: Build
        run: dotnet build src/MachiVerse.Gateway/MachiVerse.Gateway.csproj --configuration Release --no-restore
