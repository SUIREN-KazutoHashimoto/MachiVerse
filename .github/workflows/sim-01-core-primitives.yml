name: SIM-01 Core Primitives

on:
  pull_request:
    branches: [simulation]

jobs:
  build-and-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/MachiVerse.SimulationCore/MachiVerse.SimulationCore.csproj
      - name: Build
        run: dotnet build src/MachiVerse.SimulationCore/MachiVerse.SimulationCore.csproj --configuration Release --no-restore
      - name: Contract self-test
        run: dotnet run --project src/MachiVerse.SimulationCore/MachiVerse.SimulationCore.csproj --configuration Release --no-build -- --self-test
