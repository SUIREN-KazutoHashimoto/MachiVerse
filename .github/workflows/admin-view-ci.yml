name: Administration View CI

on:
  pull_request:
    branches:
      - administration-view
    paths:
      - 'src/MachiVerse.AdminView/**'
      - 'tests/MachiVerse.AdminView.Tests/**'
      - 'docs/protocols/schema/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/admin-view-ci.yml'
  push:
    branches:
      - administration-view
    paths:
      - 'src/MachiVerse.AdminView/**'
      - 'tests/MachiVerse.AdminView.Tests/**'
      - 'docs/protocols/schema/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/admin-view-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test Admin View
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/MachiVerse.AdminView.Tests/MachiVerse.AdminView.Tests.csproj

      - name: Build
        run: dotnet build tests/MachiVerse.AdminView.Tests/MachiVerse.AdminView.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/MachiVerse.AdminView.Tests/MachiVerse.AdminView.Tests.csproj --configuration Release --no-build --logger 'console;verbosity=normal'
