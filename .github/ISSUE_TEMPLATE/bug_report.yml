name: 不具合報告
description: MachiVerse の不具合を報告します
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。再現性と影響範囲を確認できる情報を記載してください。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 発生している問題を簡潔に説明してください。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 問題を再現できる手順を記載してください。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      description: 本来どのように動作するべきか記載してください。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際に起きた結果を記載してください。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: OS、.NET、ブランチ、コミットなど、分かる範囲で記載してください。

  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: ログ、スクリーンショット、関連Issueなどがあれば記載してください。

  - type: checkboxes
    id: security
    attributes:
      label: 確認
      options:
        - label: セキュリティ上の機密情報を含む報告ではありません
          required: true
