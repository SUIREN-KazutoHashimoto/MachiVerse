name: 機能・設計提案
description: 新機能、改善、設計変更を提案します
title: "[Proposal] "
labels: []
body:
  - type: textarea
    id: background
    attributes:
      label: 背景・課題
      description: どのような課題や目的があるか記載してください。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 提案する機能や設計を記載してください。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 影響範囲
      description: 影響しそうなコンポーネント、設計書、プロトコル等を分かる範囲で記載してください。

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した別案があれば記載してください。

  - type: textarea
    id: open-questions
    attributes:
      label: 未確定事項
      description: 提案時点で確定していない事項を記載してください。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認
      options:
        - label: このIssueは提案であり、承認前の内容を確定仕様として扱わないことを理解しています
          required: true
