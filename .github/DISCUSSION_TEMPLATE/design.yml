title: "[設計] "
body:
  - type: markdown
    attributes:
      value: |
        Architecture、Protocol、コンポーネント間の責務境界など、MachiVerseの設計について議論するためのフォームです。
        Discussionでの議論や合意だけを根拠として仕様を確定しません。正式に採用する内容は、必要に応じてIssueやPull Requestを通じて正本となる設計文書・Protocol・ROADMAPへ反映します。

  - type: textarea
    id: topic
    attributes:
      label: 議論したい設計事項
      description: 何について議論したいのか、現在どこが未確定または課題なのかを記載してください。
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 主な対象
      options:
        - Simulation Core
        - Gateway
        - View
        - Administration View
        - Protocol
        - Documentation / Repository maintenance
        - Add-on / Integration
        - 複数コンポーネント
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: 前提・制約
      description: 既に確定している要件、責務境界、性能・決定論・互換性上の制約、関連する設計文書やProtocolなどを記載してください。
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: 検討している案
      description: 現時点で考えられる選択肢と、それぞれの利点・欠点があれば記載してください。
    validations:
      required: true

  - type: textarea
    id: open-questions
    attributes:
      label: 未解決事項
      description: このDiscussionで確認・整理・決定したい事項を記載してください。
