title: "[成果発表] "
body:
  - type: markdown
    attributes:
      value: |
        MachiVerseに関連する試作品、実験、検証結果、ツール、アドオン、その他の成果物を共有する場所です。
        ここで紹介された内容がMachiVerseの公式機能・公式アドオンとして承認または採用されたことを意味するものではありません。

  - type: textarea
    id: overview
    attributes:
      label: 共有内容
      description: 何を作成・検証したのか、どのような結果が得られたのかを説明してください。
    validations:
      required: true

  - type: textarea
    id: relation
    attributes:
      label: MachiVerseとの関係
      description: 使用したコンポーネント、Protocol、アドオン、ブランチ等を分かる範囲で記載してください。
    validations:
      required: true

  - type: textarea
    id: links
    attributes:
      label: 参考情報
      description: デモ、コード、画像、関連Discussionなどがあれば記載してください。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認
      options:
        - label: 共有内容に公開できない機密情報や第三者の権利を侵害する情報を含めていません
          required: true
